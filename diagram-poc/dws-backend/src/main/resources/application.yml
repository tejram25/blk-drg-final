server:
  # 8091. The block diagram backend runs on 8090 on the same host, so the two
  # sit next to each other and neither has to move.
  port: ${PORT:8091}

spring:
  application:
    name: dws-backend
  jackson:
    # Absent is absent. A null in this API means "we are not telling you",
    # which is a different statement from "there is no value" — the embedded
    # variant relies on that distinction.
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

dws:
  cors:
    # Browser origins allowed to call this API. Salesforce serves Lightning
    # pages from several hosts and every sandbox has its own.
    allowed-origin-patterns:
      - http://localhost:*
      - https://*.arrow.com
      - https://*.lightning.force.com
      - https://*.my.salesforce.com
      - https://*.visualforce.com
      - https://*.builder.salesforce-experience.com

logging:
  level:
    com.arrow.dws: INFO
