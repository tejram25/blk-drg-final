<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#ffffff}
  #diag{width:1600px;height:1000px;background:#ffffff}
</style></head>
<body>
<div id="diag"></div>
<script>
// Faithful port of the app's GoJS templates (features/gojs-editor).
// go.js is injected by the render script via addScriptTag before this runs.
window.buildDiagram = function(modelJson, geo) {
  const go = window.go;
  const $ = go.GraphObject.make;

  // --- custom figure generators (verbatim from gojs-shapes.ts GEO) ---
  for (const name in geo) {
    (function(d){
      go.Shape.defineFigureGenerator(name, function(_s, w, h){
        const g = go.Geometry.parse('F ' + d, true);
        g.scale(w/100, h/100);
        return g;
      });
    })(geo[name]);
  }

  const diagram = $(go.Diagram, 'diag', {
    'undoManager.isEnabled': false,
    'animationManager.isEnabled': false,
    contentAlignment: go.Spot.Center,
    padding: 24,
  });

  // ---- rich labels (port of rich-text.ts) ----
  // draw.io stores a formatted label as HTML; a GoJS TextBlock is plain text,
  // so each line is drawn as its own TextBlock.
  const RT_ENT = { amp:'&', lt:'<', gt:'>', quot:'"', apos:"'", nbsp:' ' };
  const rtDecode = (t) => String(t).replace(/&(#?\w+);/g, (m,e) => {
    const k = String(e).toLowerCase();
    if (RT_ENT[k] !== undefined) return RT_ENT[k];
    return /^#\d+$/.test(e) ? String.fromCharCode(+e.slice(1)) : m; });
  const rtIsRich = (h) => typeof h === 'string' && /<(b|strong|i|em|u|br|div|p|li|ul|ol)\b/i.test(h);
  function rtParse(html) {
    const lines = []; let runs = [], bullet = false, muted = 0;
    const marks = { bold:0, italic:0, underline:0 };
    // `force` emits an empty line, which is what a <br> means; whitespace-only
    // runs never do, so pretty-printed HTML gains no phantom lines.
    const flush = (force) => { const k = runs.filter(r=>r.text.length);
      if (k.some(r=>r.text.trim()) || bullet || force) lines.push({ runs: k.length?k:[{text:''}], bullet });
      runs = []; bullet = false; };
    const push = (t) => { if (t) runs.push({ text:t, bold:!!marks.bold, italic:!!marks.italic, underline:!!marks.underline }); };
    const re = /<\/?([a-zA-Z][a-zA-Z0-9]*)\b[^>]*>|([^<]+)/g; let m;
    while ((m = re.exec(html)) !== null) {
      if (m[2] !== undefined) { if (!muted) push(rtDecode(m[2]).replace(/\s+/g,' ')); continue; }
      const tag = m[1].toLowerCase(), close = m[0][1] === '/';
      if (tag === 'script' || tag === 'style') { muted = Math.max(0, muted + (close?-1:1)); continue; }
      if (muted) continue;
      if (tag==='b'||tag==='strong') marks.bold += close?-1:1;
      else if (tag==='i'||tag==='em') marks.italic += close?-1:1;
      else if (tag==='u') marks.underline += close?-1:1;
      else if (tag==='br') flush(true);
      else if (tag==='li') { flush(); if (!close) bullet = true; }
      else if (tag==='div'||tag==='p') flush();
      for (const k in marks) if (marks[k] < 0) marks[k] = 0;
    }
    flush();
    return lines;
  }
  function rtParseFont(base) {
    const f = String(base || '600 12.5px Roboto, sans-serif').trim();
    const m = /^((?:(?:normal|italic|oblique|bold|bolder|lighter|[1-9]00)\s+)*)(?:(\d+(?:\.\d+)?)px\s+)?(.*)$/.exec(f);
    const lead = (m&&m[1]?m[1]:'').trim().split(/\s+/).filter(Boolean);
    return { italic: lead.some(t=>/^(italic|oblique)$/i.test(t)),
             weight: lead.find(t=>/^(bold|bolder|lighter|[1-9]00)$/i.test(t)) || '',
             size: m&&m[2] ? +m[2] : 12.5,
             family: ((m&&m[3])||'').trim() || 'Roboto, sans-serif' };
  }
  const rtFormatFont = (p) => [p.italic?'italic':'', p.weight, p.size+'px', p.family].filter(Boolean).join(' ');
  function rtRunFont(base, r) {
    const p = rtParseFont(base);
    return rtFormatFont({ ...p, italic: p.italic || !!r.italic, weight: r.bold ? '700' : p.weight });
  }
  // Measured on a real 2D context, which is the engine the canvas draws with,
  // so the wrap computed here is the wrap that appears.
  let rtCtx;
  function rtMeasure(text, font) {
    if (rtCtx === undefined) rtCtx = document.createElement('canvas').getContext('2d');
    rtCtx.font = font;
    return rtCtx.measureText(text).width;
  }
  // The gap after the marker is a margin, not a space: the marker is its own
  // TextBlock now, and a TextBlock trims the whitespace off its end.
  const RT_BULLET = '\u2022', RT_BULLET_GAP = 6;
  // A TextBlock holds one font, so a line with bold in the middle is several of
  // them side by side — and GoJS cannot wrap what it cannot see as one line, so
  // the wrapping is done here.
  function rtLayout(lines, base, maxWidth) {
    const out = [];
    const plainFont = rtRunFont(base, {});
    // The font's own line box, measured — a little taller than the box GoJS
    // gives a TextBlock, which is the safe way round.
    rtMeasure('Mg', plainFont);
    const fm = rtCtx.measureText('Mg');
    const height = Math.ceil(((fm.fontBoundingBoxAscent||0) + (fm.fontBoundingBoxDescent||0))
                             || rtParseFont(base).size * 1.4);
    const bulletWidth = rtMeasure(RT_BULLET, plainFont) + RT_BULLET_GAP;
    const merge = (toks) => {
      const runs = [];
      for (const t of toks) {
        const last = runs[runs.length-1];
        if (last && last.font === t.font && last.underline === t.underline) last.text += t.text;
        else runs.push({ text: t.text, font: t.font, underline: t.underline });
      }
      return runs;
    };
    for (const line of lines) {
      const limit = Math.max(20, maxWidth - (line.bullet ? bulletWidth : 0));
      const tokens = [];
      for (const r of line.runs) {
        const font = rtRunFont(base, r);
        for (const t of String(r.text).split(/(\s+)/)) {
          if (t) tokens.push({ text: t, font, underline: !!r.underline, w: rtMeasure(t, font) });
        }
      }
      let cur = [], curW = 0, first = true;
      const emit = () => {
        while (cur.length && !cur[cur.length-1].text.trim()) { curW -= cur[cur.length-1].w; cur.pop(); }
        const lead = line.bullet && first
          ? [{ text: RT_BULLET, font: plainFont, underline: false, gap: RT_BULLET_GAP }] : [];
        out.push({ runs: lead.concat(merge(cur)),
                   indent: line.bullet && !first ? bulletWidth : 0,
                   width: curW + (line.bullet ? bulletWidth : 0), height });
        cur = []; curW = 0; first = false;
      };
      if (!tokens.length) { emit(); continue; }
      for (const t of tokens) {
        if (cur.length && curW + t.w > limit && t.text.trim()) emit();
        if (!cur.length && !t.text.trim()) continue;
        cur.push(t); curW += t.w;
      }
      if (cur.length) emit();
    }
    return out;
  }
  const RICH_MARGIN = 6;
  const rtLayoutOf = (d) => rtLayout(rtParse(String(d.html)),
      String(d.font || '600 12.5px Roboto, sans-serif'),
      typeof d.textWidth === 'number' ? d.textWidth : 150);
  function richItems(d) {
    if (!rtIsRich(d && d.html)) return [];
    const stroke = String(d.labelColor || '#1f2937');
    return rtLayoutOf(d).map(l => ({ indent: l.indent, runs: l.runs.map(r => ({ ...r, stroke })) }));
  }
  function richAlignment(d) {
    if (!rtIsRich(d && d.html)) return go.Spot.Left;
    if (rtParse(String(d.html)).some(l => l.bullet)) return go.Spot.Left;
    const a = String(d.textAlign || 'center');
    return a === 'right' ? go.Spot.Right : a === 'left' ? go.Spot.Left : go.Spot.Center;
  }
  // A Spot panel takes the size of everything in it, so a label taller than its
  // block hangs outside the outline. The block grows to hold it instead — only
  // for a formatted label; a plain one is the size the artwork says it is.
  function shapeMinSize(d) {
    const floor = go.Size.parse(String((d && d.minSize) || '48 40'));
    if (!rtIsRich(d && d.html)) return floor;
    const ls = rtLayoutOf(d);
    const w = Math.ceil(ls.reduce((m,l)=>Math.max(m,l.width),0));
    const h = Math.ceil(ls.reduce((m,l)=>m+l.height,0));
    return new go.Size(Math.max(floor.width, w + RICH_MARGIN*2 + 4),
                       Math.max(floor.height, h + RICH_MARGIN*2 + 4));
  }

  // ---- ports ----
  const sideSpot = (s) => {
    const sp = go.Spot.parse(s);
    const dl = sp.x, dr = 1 - sp.x, dt = sp.y, db = 1 - sp.y;
    const m = Math.min(dl, dr, dt, db);
    return m === dl ? go.Spot.Left : m === dr ? go.Spot.Right : m === dt ? go.Spot.Top : go.Spot.Bottom;
  };
  // A connection rail, not a dot: the whole edge is linkable, so several wires
  // can leave one side and GoJS spreads them along it.
  const sidePort = (id, spot, side, vertical) => $(go.Shape, 'RoundedRectangle', {
    parameter1: 4, fill:'rgba(34,211,238,0.30)', stroke:'#22d3ee', strokeWidth:1,
    // Mirrors the editor's rails: 14px wide and wholly inside the block, with
    // its outer edge on the outline.
    desiredSize: vertical ? new go.Size(14, NaN) : new go.Size(NaN, 14),
    stretch: vertical ? go.GraphObject.Vertical : go.GraphObject.Horizontal,
    cursor:'crosshair', opacity:0, alignment:spot, alignmentFocus:spot,
    portId:id, fromLinkable:true, toLinkable:true,
    fromSpot:side||spot, toSpot:side||spot });
  const SIDE = { T:[go.Spot.Top,go.Spot.TopSide,false], R:[go.Spot.Right,go.Spot.RightSide,true],
                 B:[go.Spot.Bottom,go.Spot.BottomSide,false], L:[go.Spot.Left,go.Spot.LeftSide,true] };
  const sidePorts = () => Object.keys(SIDE).map((k)=> sidePort(k, SIDE[k][0], SIDE[k][1], SIDE[k][2]));
  const pinPort = $(go.Panel, 'Spot',
    new go.Binding('alignment','spot',go.Spot.parse),
    // Marker wholly inside the block, outer edge on the outline: the wire then
    // meets the block instead of stopping half a marker short of it.
    new go.Binding('alignmentFocus','spot',sideSpot),
    $(go.Shape,'Circle',{ desiredSize:new go.Size(11,11), fill:'#0f172a', stroke:'#22d3ee',
      strokeWidth:1.5, cursor:'crosshair', opacity:0, fromLinkable:true, toLinkable:true },
      new go.Binding('portId','portId'),
      new go.Binding('fromSpot','spot',sideSpot),
      new go.Binding('toSpot','spot',sideSpot)));
  const body = { portId:'', fromLinkable:false, toLinkable:false, cursor:'move' };
  // Mirrors the editor's overlay: `stretch: Fill` takes the size of the node's
  // own main element, so one overlay serves a shape (which carries an explicit
  // `size`) and a group (sized by its members) alike.
  const pinOverlay = () => $(go.Panel,'Spot',
    { itemTemplate: pinPort, stretch: go.GraphObject.Fill },
    new go.Binding('itemArray','ports'),
    $(go.Shape,'Rectangle',{ isPanelMain:true, fill:null, stroke:null, strokeWidth:0,
      pickable:false, stretch: go.GraphObject.Fill }));
  const sizeBind = () => new go.Binding('desiredSize','size',
    (s)=> s? go.Size.parse(s): new go.Size(NaN,NaN)).makeTwoWay((sz)=>go.Size.stringify(sz));

  // ---- block ----
  const block = $(go.Node,'Spot',
    { locationSpot:go.Spot.Center, resizable:true, resizeObjectName:'BODY', portSpreading: go.PortSpreading.Evenly },
    new go.Binding('location','loc',go.Point.parse),
    $(go.Panel,'Auto', body, { name:'BODY' }, sizeBind(),
      $(go.Shape,'RoundedRectangle',
        { parameter1:10, fill:'#ffffff', stroke:'#d2d6dc', strokeWidth:1.5, minSize:new go.Size(150,52) },
        new go.Binding('stroke','color')),
      $(go.Panel,'Horizontal',{ margin:8 },
        $(go.Panel,'Auto',{ width:36, height:36, margin:new go.Margin(0,8,0,0) },
          $(go.Shape,'RoundedRectangle',{ parameter1:8, strokeWidth:0 }, new go.Binding('fill','color')),
          $(go.TextBlock,{ font:'20px Material Icons', stroke:'#ffffff' }, new go.Binding('text','icon'))),
        $(go.Panel,'Vertical',{ alignment:go.Spot.Left },
          $(go.TextBlock,{ font:'600 12.5px Roboto, sans-serif', stroke:'#1f2937', alignment:go.Spot.Left },
            new go.Binding('text')),
          $(go.TextBlock,{ font:'10px Roboto, sans-serif', stroke:'#9aa0a8', alignment:go.Spot.Left },
            new go.Binding('text','subtitle'))))),
    ...sidePorts(),
    pinOverlay());
  diagram.nodeTemplateMap.set('block', block);
  diagram.nodeTemplate = block;

  // ---- shape ----
  const shape = $(go.Node,'Spot',
    { locationSpot:go.Spot.Center, resizable:true, resizeObjectName:'SHAPE', portSpreading: go.PortSpreading.Evenly },
    new go.Binding('location','loc',go.Point.parse),
    $(go.Panel,'Spot', body,
      $(go.Shape,'Rectangle',
        { name:'SHAPE', isPanelMain:true, strokeWidth:2, fill:'#ffffff', stroke:'#334155', minSize:new go.Size(48,40) },
        new go.Binding('figure','figure'), sizeBind(),
        new go.Binding('fill','fill'), new go.Binding('stroke','stroke'),
        new go.Binding('minSize','',shapeMinSize),
        new go.Binding('strokeWidth','strokeWidth'),
        new go.Binding('strokeDashArray','dashPattern',(v)=> v===true?[5,4]:(Array.isArray(v)?v:null))),
      $(go.TextBlock,
        { font:'600 12.5px Roboto, sans-serif', stroke:'#1f2937', textAlign:'center', maxSize:new go.Size(150,NaN), margin:6 },
        new go.Binding('visible','html',(h)=>!rtIsRich(h)),
        new go.Binding('text'), new go.Binding('stroke','labelColor'), new go.Binding('font','font'),
        new go.Binding('textAlign','textAlign'), new go.Binding('isUnderline','underline'),
        new go.Binding('maxSize','textWidth',(w)=> new go.Size(w,NaN))),
      $(go.Panel,'Vertical',
        { margin:RICH_MARGIN, visible:false,
          itemTemplate: $(go.Panel,'Horizontal',
            { itemTemplate: $(go.Panel,'Auto',
                $(go.TextBlock,{ alignment:go.Spot.Left },
                  new go.Binding('text'), new go.Binding('font'), new go.Binding('stroke'),
                  new go.Binding('isUnderline','underline'),
                  new go.Binding('margin','gap',(g)=> new go.Margin(0,g||0,0,0)))) },
            new go.Binding('margin','indent',(i)=> new go.Margin(0,0,0,i||0)),
            new go.Binding('itemArray','runs')) },
        new go.Binding('visible','html',(h)=>rtIsRich(h)),
        new go.Binding('defaultAlignment','',richAlignment),
        new go.Binding('itemArray','',richItems))),
    $(go.TextBlock,{ alignment:new go.Spot(0.5,1,0,7), alignmentFocus:go.Spot.Top,
      font:'10.5px Roboto, sans-serif', stroke:'#94a3b8', textAlign:'center', maxSize:new go.Size(170,NaN) },
      new go.Binding('text','sub'),
      new go.Binding('stroke','capColor'),
      new go.Binding('visible','sub',(s)=>!!s && String(s).length>0)),
    ...sidePorts(),
    pinOverlay());
  diagram.nodeTemplateMap.set('shape', shape);

  // ---- symbol ----
  const symbol = $(go.Node,'Spot',
    { locationSpot:go.Spot.Center, locationObjectName:'BODY', selectionObjectName:'BODY', resizable:true, resizeObjectName:'BODY' },
    new go.Binding('location','loc',go.Point.parse),
    $(go.Panel,'Spot',{ name:'BODY', isPanelMain:true, itemTemplate:pinPort, ...body },
      new go.Binding('desiredSize','size',go.Size.parse),
      new go.Binding('angle','angle',(a)=> (typeof a==='number' && a%90===0)? a:0),
      new go.Binding('itemArray','ports'),
      $(go.Picture,{ isPanelMain:true, stretch:go.GraphObject.Fill, imageStretch:go.GraphObject.Fill, background:'transparent' },
        new go.Binding('source','source'))),
    $(go.TextBlock,{ font:'bold 11px Roboto, sans-serif', stroke:'#94a3b8', alignment:new go.Spot(0.5,1,0,6), alignmentFocus:go.Spot.Top },
      new go.Binding('text'), new go.Binding('stroke','labelColor')),
    $(go.TextBlock,{ font:'10px Roboto, sans-serif', stroke:'#94a3b8', alignment:new go.Spot(0.5,1,0,20), alignmentFocus:go.Spot.Top },
      new go.Binding('text','value'), new go.Binding('visible','value',(v)=>!!v), new go.Binding('stroke','labelColor')));
  diagram.nodeTemplateMap.set('symbol', symbol);

  // ---- basic ----
  const basicSym = $(go.Node,'Spot',
    { locationSpot:go.Spot.Center, resizable:true, itemTemplate:pinPort },
    new go.Binding('location','loc',go.Point.parse),
    new go.Binding('desiredSize','size',go.Size.parse),
    new go.Binding('itemArray','ports'),
    $(go.Panel,'Spot',{ isPanelMain:true, stretch:go.GraphObject.Fill, ...body },
      $(go.Picture,{ isPanelMain:true, stretch:go.GraphObject.Fill, imageStretch:go.GraphObject.Fill, background:'transparent' },
        new go.Binding('source','source')),
      $(go.TextBlock,{ alignment:go.Spot.Center, font:'13px Roboto, sans-serif', stroke:'#1f2937', maxSize:new go.Size(160,NaN), textAlign:'center' },
        new go.Binding('text'), new go.Binding('stroke','labelColor'))));
  diagram.nodeTemplateMap.set('basic', basicSym);

  // ---- link ----
  // Containers below the blocks, wires above them — mirrors the editor. A wire
  // crossing a subsystem box or the face of a big block is drawn over it, which
  // is what the source artwork does and what diagram 3 needs: its interface
  // chips sit on the processor, so every wire into one crosses the processor.
  diagram.addLayerBefore(new go.Layer({ name:'Containers' }), diagram.findLayer('Background'));
  diagram.linkTemplate = $(go.Link,
    { layerName:'Foreground',
      routing:go.Link.Orthogonal, corner:8, relinkableFrom:true, relinkableTo:true, reshapable:true, resegmentable:true },
    new go.Binding('routing','routing',(r)=> r==='normal'||r==='smooth'? go.Link.Normal: go.Link.Orthogonal),
    new go.Binding('curve','routing',(r)=> r==='smooth'? go.Link.Bezier: go.Link.None),
    new go.Binding('corner','wire',(w)=> w?0:8),
    new go.Binding('corner','corner'),
    new go.Binding('fromSpot','fromSpotXY',(s)=> s? go.Spot.parse(s): go.Spot.Default),
    new go.Binding('toSpot','toSpotXY',(s)=> s? go.Spot.parse(s): go.Spot.Default),
    // How far the wire runs straight out before it turns, and so where the
    // crossbar sits: what keeps two wires making the same journey apart.
    new go.Binding('fromEndSegmentLength','fromEnd'),
    new go.Binding('toEndSegmentLength','toEnd'),
    $(go.Shape,{ isPanelMain:true, stroke:'transparent', strokeWidth:18 }),
    $(go.Shape,{ isPanelMain:true, strokeWidth:2, stroke:'#94a3b8' },
      new go.Binding('stroke','color'), new go.Binding('strokeWidth','width'), new go.Binding('strokeDashArray','dash')),
    $(go.Shape,{ toArrow:'Triangle', fill:'#94a3b8', stroke:null, scale:1 },
      new go.Binding('fill','color'), new go.Binding('visible','wire',(w)=>!w),
      new go.Binding('toArrow','arrow'),
      new go.Binding('scale','arrowScale')),
    // A second arrowhead at the from end, for a two-way connection.
    $(go.Shape,{ fromArrow:'BackwardTriangle', fill:'#94a3b8', stroke:null, scale:1, visible:false },
      new go.Binding('fill','color'),
      new go.Binding('visible','twoWay',(t)=>!!t),
      // Mirrored, or both heads point the same way.
      new go.Binding('fromArrow','arrow',(n)=> !n||n==='Standard'?'Backward':(String(n).startsWith('Backward')?n:'Backward'+n)),
      new go.Binding('scale','arrowScale')),
    $(go.Panel,'Auto',{ segmentIndex:NaN, segmentFraction:0.5, visible:false },
      new go.Binding('visible','text',(t)=>!!t),
      new go.Binding('segmentFraction','textFraction'),
      new go.Binding('segmentIndex','textSegment'),
      new go.Binding('segmentOffset','textOffset',go.Point.parse),
      $(go.Shape,'RoundedRectangle',{ parameter1:4, fill:'rgba(255,255,255,0.9)', stroke:null },
        new go.Binding('fill','textBg')),
      $(go.TextBlock,{ font:'600 10px Roboto, sans-serif', stroke:'#334155', margin:new go.Margin(1.5,5,1.5,5) },
        new go.Binding('text'), new go.Binding('stroke','textColor'),
        new go.Binding('font','textFont'))));

  // ---- group (ENHANCED: data-driven colored container) ----
  // Backwards compatible: with no styling data it renders the original dashed
  // container. New optional data: fill, stroke, dashed(bool), titleColor,
  // titleAlign ("0.5 0.05" spot string), titleFont, corner.
  const group = $(go.Group,'Spot',
    { layerName:'Containers',
      locationSpot:go.Spot.Center, ungroupable:true, computesBoundsAfterDrag:true, handlesDragDropForMembers:true, portSpreading: go.PortSpreading.Evenly },
    new go.Binding('location','loc',go.Point.parse),
    new go.Binding('isSubGraphExpanded','expanded'),
    $(go.Panel,'Auto',
      $(go.Shape,'RoundedRectangle',
        { parameter1:12, fill:'rgba(148,163,184,0.05)', stroke:'#f5a623', strokeWidth:1.4 },
        new go.Binding('parameter1','corner'),
        new go.Binding('fill','fill'),
        new go.Binding('stroke','stroke'),
        new go.Binding('strokeWidth','borderWidth'),
        new go.Binding('strokeDashArray','dashed',(v)=> v===false? null : [7,4])),
      $(go.Placeholder,{ padding:new go.Margin(30,16,16,16) },
        new go.Binding('padding','pad',(p)=> p? go.Margin.parse(p): new go.Margin(30,16,16,16)))),
    // title overlay, positioned by data.titleAlign (default top-left)
    $(go.TextBlock,
      { font:'bold 12px Roboto, sans-serif', stroke:'#f5a623', alignment:new go.Spot(0,0,10,8), alignmentFocus:go.Spot.TopLeft },
      new go.Binding('text'),
      new go.Binding('stroke','titleColor'),
      new go.Binding('font','titleFont'),
      new go.Binding('alignment','titleAlign',(s)=> go.Spot.parse(s)),
      new go.Binding('alignmentFocus','titleFocus',(s)=> go.Spot.parse(s))),
    ...sidePorts(),
    pinOverlay());
  diagram.groupTemplate = group;

  diagram.model = go.Model.fromJson(modelJson);
  return diagram;
};
</script>
</body>
</html>
