<div class="prop-section">Text</div>

<div class="text-grid">
  <label class="wide"><span>Font</span>
    <select [ngModel]="family" (ngModelChange)="set('fontFamily', $event)">
      @for (f of families; track f.value) { <option [value]="f.value">{{ f.label }}</option> }
      @if (!family) { <option value="">Custom</option> }
    </select></label>
  <label><span>Size</span>
    <input type="number" min="5" max="60" step="0.5"
           [ngModel]="size" (ngModelChange)="set('labelSize', $event)" /></label>
  <label><span>Colour</span>
    <input type="color" [ngModel]="sel.labelColor" (ngModelChange)="set('labelColor', $event)" /></label>
</div>

<!-- mousedown is swallowed so pressing a button does not drop the selection
     these buttons are about to act on. -->
<div class="text-bar" (mousedown)="keepSelection($event)">
  <div class="btn-group">
    <button type="button" [class.on]="markOn('bold')" (click)="toggleMark('bold')" matTooltip="Bold"><b>B</b></button>
    <button type="button" [class.on]="markOn('italic')" (click)="toggleMark('italic')" matTooltip="Italic"><i>I</i></button>
    <button type="button" [class.on]="markOn('underline')" (click)="toggleMark('underline')" matTooltip="Underline"><u>U</u></button>
  </div>
  <div class="btn-group">
    <button type="button" [class.on]="align === 'left'" (click)="set('textAlign', 'left')" matTooltip="Align left">
      <mat-icon>format_align_left</mat-icon></button>
    <button type="button" [class.on]="align === 'center'" (click)="set('textAlign', 'center')" matTooltip="Centre">
      <mat-icon>format_align_center</mat-icon></button>
    <button type="button" [class.on]="align === 'right'" (click)="set('textAlign', 'right')" matTooltip="Align right">
      <mat-icon>format_align_right</mat-icon></button>
  </div>
  @if (formatted) {
    <div class="btn-group">
      <button type="button" [class.on]="bulletOn" (click)="toggleBullet()" matTooltip="Bullet list">
        <mat-icon>format_list_bulleted</mat-icon></button>
    </div>
  }
</div>

<label><span>Wrap width</span>
  <input type="number" min="20" max="900" step="5"
         [ngModel]="wrapWidth" (ngModelChange)="set('textWidth', $event)" /></label>

<!-- mxGraph's html=1: the label stops being a string and becomes a document -->
<button class="secondary-btn" [class.on]="formatted" (click)="set('formatted', !formatted)">
  <mat-icon>{{ formatted ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
  <span>Formatted text</span>
</button>

@if (formatted) {
  <div class="text-hint">Select words below and press <b>B</b>, <b>I</b> or <b>U</b>. The block
    grows to hold whatever you write.</div>
  <div #editor class="rich-editor" contenteditable="true" spellcheck="false"
       [class.focused]="editing"
       (focus)="onFocus()" (blur)="onBlur()" (input)="onInput()"></div>
}
